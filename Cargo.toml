[workspace]
resolver = "2"
members = ["Client/core", "Client/windows", "Server"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# MSVC /Z7 编译 sqlite3.c 这类巨型翻译单元会触发 cl error D8050
# （未能将命令行放入调试记录中）；仅对该 C 依赖关闭调试信息规避。
[profile.dev.package.libsqlite3-sys]
debug = false

[profile.test.package.libsqlite3-sys]
debug = false
