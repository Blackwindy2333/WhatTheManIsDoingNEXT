[package]
name = "wtmd-client-win"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WhatTheManDoingNEXT Windows 客户端：前台应用采集、托盘与设置窗口"

# 依赖面最小化：仅 wtmd-core（含同步 ureq）+ windows-sys（原生 Win32，按 feature 裁剪）。
# 禁止 webview/egui/reqwest/tokio 等重依赖（PLAN.md 阶段 4 / 任务书技术约束）。
[dependencies]
wtmd-core = { path = "../core" }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
